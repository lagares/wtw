<!doctype html>
<html ng-app="miniWeebly">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width" />
	<title>Mini Weebly (ng)</title>
	<link rel="stylesheet" href="css/wtw.css" />
</head>
<body ng-controller="pgCtrl">
	<header>
		<nav>
			<h1><a href="#" ng-click="setCurrentPage(null)"><img src="images/Weebly-Logo.png" alt="Weebly Logo">Weebly</a></h1>
		</nav>
	</header>
	<main>
		<div id="sidebar">
			<div class="tools-block">
				<h2>templates</h2>
				<form name="editPageForm">
					<ul class="tools-pane tools-pages">
						<li ng-repeat="page in pages track by $index" class="page-badge" ng-class="{'selected':isCurrentPage(page)}">
							<input type="text" ng-model="page.name" ng-disabled="!enabled" ng-keypress="($event.which === 13)?editPageName(page):0" select-contents />
							<div>
								<span ng-click="editEnable(page)" ng-class="{ active: enabled }" class="button button-edit-pg" ></span>
								<span class="button button-remove-pg" ng-click="removePage(page)"></span>
							</div>
						</li>
					</ul>
				</form>

				<form id="addPageForm" name="addPageForm" ng-submit="addPage(page)">
					<ul class="tools-pane tools-pages">
						<li id="add-new" class="add-new">
							<input type="text" ng-model="page.name" select-contents />
							<input type="submit" class="button button-add-new-pg" ng-disabled="!addPageForm.$dirty" />
						</li>
					</ul>
				</form>

			</div>
			<div id="content-tools" class="tools-block">
				<h2>elements</h2>
				<!-- no space between </li><li> to allow inline-blocks to abut neatly -->
				<ul>
					<li class="tools-pane tools-elements">
						<div data-contenttype="title" class="tool-icon title"></div>
						<label>title</label>
					</li><li class="tools-pane tools-elements">
						<div data-contenttype="text" class="tool-icon text"></div>
						<label>text</label>
					</li><li class="tools-pane tools-elements">
						<div data-contenttype="image" class="tool-icon image"></div>
						<label>image</label>
					</li><li class="tools-pane tools-elements">
						<div data-contenttype="nav" class="tool-icon nav"></div>
						<label>nav</label>
					</li>
				</ul>
			</div>

			<!-- no space between </div><div> to allow inline-blocks to abut neatly -->
			<div class="tools-block">
				<h2>settings</h2>
				<div class="tools-pane tools-other">
					<input type="checkbox" id="toggle-site-grid" name="toggle-site-grid" class="toggle"><label for="toggle-site-grid">site grid<span></span></label>
				</div>
			</div> 
		</div><div id="pasteboard">
			<ul class="pagesNav">
				<li ng-repeat="page in pages track by $index"><a href="#/pages/{{page.name}}" class="button" ng-click="setCurrentPage(page)" ng-class="{ 'selected' : isCurrentPage(page) }">{{page.name}}</a></li>
			</ul>

			<!-- all the custom content in a 'page' lives inside this <ul> -->
			<ul id="content-added-items">
				<li ng-repeat="block in blocks | filter: {page:currentPage.name}" class="placeholder {{block.type}}" ng-class=" caution ? 'caution' : '' ">
					<span ng-model="block" ng-mouseover="cautionOn(block)" ng-mouseleave="cautionOff(block)" ng-click="removeBlock(block)" class="delete-element"></span>
					<span class="handle-e"></span><span class="handle-s"></span><span class="handle-w"></span>
					<div contenteditable ng-model="block.contents" ng-bind-html="block.contents">{{block.contents}}</div>
				</li>
			</ul>
 		</div>
	</main>

	<!-- dependencies -->
    <script src="//ajax.googleapis.com/ajax/libs/jquery/2.0.3/jquery.min.js"></script>
    <script src="//ajax.googleapis.com/ajax/libs/jqueryui/1.10.3/jquery-ui.min.js"></script>
	<script src="//ajax.googleapis.com/ajax/libs/angularjs/1.3.11/angular.min.js"></script>
	<script src="//ajax.googleapis.com/ajax/libs/angularjs/1.0.3/angular-sanitize.js"></script>

	<!-- controllers and custom scripts -->
	<script src="js/wtw.js"></script>

</body>
</html>
